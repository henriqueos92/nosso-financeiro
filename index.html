                {g.person ? `Cartões de ${g.person.name}` : "Outros cartões"}
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {g.cards.map(c => (
                  <Card key={c.id} onClick={()=>{ setCardEditDraft({ id:c.id, name:c.name, bank:c.bank, limit:String(c.limit), closingDay:String(c.closingDay), dueDay:String(c.dueDay) }); setCardEditing(true); }} style={{ cursor:"pointer" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom: 10 }}>
                      <BankBadge bank={c.bank} size={38} />
                      <div style={{ flex:1 }}>
                        <div style={{ fontFamily:"Inter", fontSize:13.5, fontWeight:700 }}>{c.name}</div>
                        <div style={{ fontFamily:"Inter", fontSize:11.5, color:"var(--muted-2)" }}>Limite {brl(c.limit)} · fecha dia {c.closingDay}</div>
                      </div>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", background:"var(--soft)", borderRadius:12, padding:"10px 12px" }}>
                      <div>
                        <div style={{ fontFamily:"Inter", fontSize:11, color:"var(--muted-2)", fontWeight:700 }}>Fatura atual · vence dia {c.dueDay}</div>
                        <div style={{ fontFamily:"IBM Plex Mono", fontSize:16, fontWeight:600, color:"var(--accent)" }}>{brl(c.invoice)}</div>
                      </div>
                    </div>
                  </Card>
                ))}
              </div>
            </div>
          ))}
          <button onClick={()=>setAddingCard(true)} style={primaryBtn}>+ Cadastrar cartão</button>
        </div>
        <Sheet open={addingCard} onClose={()=>setAddingCard(false)} title="Novo cartão">
          <Field label="Apelido do cartão"><input style={inputStyle} value={cardDraft.name} onChange={e=>setCardDraft({...cardDraft,name:e.target.value})} /></Field>
          <Field label="Banco">
            <select style={inputStyle} value={cardDraft.bank} onChange={e=>setCardDraft({...cardDraft,bank:e.target.value})}>
              {Object.entries(allBanks()).map(([k,b])=><option key={k} value={k}>{b.name}</option>)}
            </select>
            <button onClick={()=>setNewBankOpen(true)} style={{ marginTop:6, border:"none", background:"transparent", color:"var(--accent)", fontFamily:"Inter", fontSize:12, fontWeight:700, cursor:"pointer", padding:0 }}>+ Novo banco</button>
          </Field>
          <Field label="Limite do cartão"><input style={inputStyle} type="number" value={cardDraft.limit} onChange={e=>setCardDraft({...cardDraft,limit:e.target.value})} /></Field>
          <button onClick={()=>{
            if(!cardDraft.name||!cardDraft.limit) return;
            patch(d=>({...d, cards:[...d.cards,{ id:uid(), name:cardDraft.name, bank:cardDraft.bank, limit:parseFloat(cardDraft.limit), closingDay:5, dueDay:12, invoice:0, ownerId: myPersonId }]}));
            setAddingCard(false); setCardDraft({name:"",bank:"nubank",limit:""});
          }} style={primaryBtn}>Salvar cartão</button>
        </Sheet>
        <NewBankSheet open={newBankOpen} onClose={()=>setNewBankOpen(false)} patch={patch} onCreated={(key)=>setCardDraft(d=>({...d, bank:key}))} />
        <Sheet open={cardEditing} onClose={()=>setCardEditing(false)} title="Editar cartão">
          {cardEditDraft && (
            <div>
              <Field label="Apelido do cartão"><input style={inputStyle} value={cardEditDraft.name} onChange={e=>setCardEditDraft({...cardEditDraft,name:e.target.value})} /></Field>
              <Field label="Banco">
                <select style={inputStyle} value={cardEditDraft.bank} onChange={e=>setCardEditDraft({...cardEditDraft,bank:e.target.value})}>
                  {Object.entries(allBanks()).map(([k,b])=><option key={k} value={k}>{b.name}</option>)}
                </select>
              </Field>
              <Field label="Limite do cartão"><input style={inputStyle} type="number" value={cardEditDraft.limit} onChange={e=>setCardEditDraft({...cardEditDraft,limit:e.target.value})} /></Field>
              <Field label="Dia de fechamento"><input style={inputStyle} type="number" min="1" max="31" value={cardEditDraft.closingDay} onChange={e=>setCardEditDraft({...cardEditDraft,closingDay:e.target.value})} /></Field>
              <Field label="Dia de vencimento"><input style={inputStyle} type="number" min="1" max="31" value={cardEditDraft.dueDay} onChange={e=>setCardEditDraft({...cardEditDraft,dueDay:e.target.value})} /></Field>
              <button onClick={saveCardEdit} style={primaryBtn}>Salvar alterações</button>
              <button onClick={removeCard} style={{ ...secondaryBtn, marginTop: 10 }}>Excluir cartão</button>
            </div>
          )}
        </Sheet>
      </div>
    );
  }

  if (screen === "categorias") {
    return (
      <div style={{ paddingBottom: 100 }}>
        <HeaderBar title="Categorias" />
        <div style={{ padding: "10px 18px 0" }}>
          <div style={{ display:"flex", gap:8, marginBottom:14 }}>
            <Pill active={catType==="despesa"} onClick={()=>setCatType("despesa")}>Despesas</Pill>
            <Pill active={catType==="receita"} onClick={()=>setCatType("receita")}>Receitas</Pill>
          </div>
          <div style={{ display:"flex", gap:8, marginBottom:14 }}>
            <input style={inputStyle} placeholder="Nova categoria..." value={newCat} onChange={e=>setNewCat(e.target.value)} />
            <button onClick={()=>{
              if(!newCat) return;
              patch(d=>({...d, categories: { ...(d.categories||{despesa:DESPESA_CATS,receita:RECEITA_CATS}), [catType]: [...((d.categories?.[catType])||(catType==="despesa"?DESPESA_CATS:RECEITA_CATS)), newCat] } }));
              setNewCat("");
            }} style={{ ...navBtn, width:44, background:"#16283D" }}><Icon name="plus" color="#fff" size={18} /></button>
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {(data.categories?.[catType] || (catType==="despesa"?DESPESA_CATS:RECEITA_CATS)).map(c => (
              <div key={c} style={{ padding:"7px 12px", borderRadius:999, background:"var(--card)", border:"1.5px solid var(--border)", fontFamily:"Inter", fontSize:12.5, fontWeight:600 }}>{c}</div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (screen === "tags") {
    const usedTags = data.transactions.map(t=>t.tag).filter(Boolean);
    const allTags = [...new Set([...(data.tags||[]), ...usedTags])];
    return (
      <div style={{ paddingBottom: 100 }}>
        <HeaderBar title="Tags" />
        <div style={{ padding: "10px 18px 0" }}>
          <div style={{ display:"flex", gap:8, marginBottom:14 }}>
            <input style={inputStyle} placeholder="Nova tag..." value={newTag} onChange={e=>setNewTag(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") addTag(); }} />
            <button onClick={addTag} style={{ ...navBtn, width:44, background:"#16283D" }}><Icon name="plus" color="#fff" size={18} /></button>
          </div>
          {allTags.length===0 && <div style={{ fontFamily:"Inter", fontSize:13.5, color:"var(--muted)" }}>Nenhuma tag criada ainda.</div>}
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {allTags.map(t => (
              <div key={t} style={{ display:"flex", alignItems:"center", gap:6, padding:"7px 8px 7px 12px", borderRadius:999, background:"var(--card)", border:"1.5px solid var(--border)", fontFamily:"Inter", fontSize:12.5, fontWeight:600 }}>
                #{t}
                <button onClick={()=>removeTag(t)} style={{ border:"none", background:"transparent", cursor:"pointer", display:"flex", alignItems:"center", padding:2 }}>
                  <Icon name="x" size={12} color="var(--muted-2)" />
                </button>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // main account screen
  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", padding:"30px 18px 10px" }}>
        <div style={{ width: 78, height: 78, borderRadius:"50%", background:"#16283D", color:"#FFFFFF", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"Source Serif 4, serif", fontSize: 28, fontWeight:600 }}>
          {(myPerson?.name || "?").slice(0,1)}
        </div>
        <div style={{ fontFamily:"Source Serif 4, serif", fontSize:20, fontWeight:600, color:"var(--accent)", marginTop:10 }}>{myPerson?.name || "Você"}</div>
        <button onClick={()=>{ setEditDraft(myPerson || {name:"",email:"",birthdate:""}); setScreen("edit"); }} style={{ marginTop:8, border:"1.5px solid var(--accent)", background:"transparent", color:"var(--accent)", borderRadius:10, padding:"8px 16px", fontFamily:"Inter", fontWeight:700, fontSize:12.5, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
          <Icon name="edit" size={14} /> Editar perfil
        </button>
        <button onClick={switchPerson} style={{ marginTop:8, border:"none", background:"transparent", color:"var(--muted-2)", fontFamily:"Inter", fontWeight:600, fontSize:12, cursor:"pointer" }}>
          Não é você? Trocar de pessoa
        </button>
      </div>

      <div style={{ padding: "10px 18px 0" }}>
        <Card style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: 14, marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 36, height: 36, borderRadius: 10, background: "var(--soft)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name={isDark ? "moon" : "sun"} size={17} color="var(--accent)" />
            </div>
            <div style={{ fontFamily: "Inter", fontSize: 14, fontWeight: 600, color: "var(--ink)" }}>Aparência</div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <Pill active={!isDark} onClick={() => { if (isDark) toggleTheme(); }}>Claro</Pill>
            <Pill active={isDark} onClick={() => { if (!isDark) toggleTheme(); }}>Escuro</Pill>
          </div>
        </Card>
      </div>

      <div style={{ padding: "0 18px 0", display:"flex", flexDirection:"column", gap:8 }}>
        {[
          { icon:"wallet", label:"Configurar contas", go:"conexoes" },
          { icon:"card", label:"Cartões de crédito", go:"cartoes" },
          { icon:"list", label:"Categorias", go:"categorias" },
          { icon:"tag", label:"Tags", go:"tags" },
        ].map(o => (
          <Card key={o.label} onClick={()=>setScreen(o.go)} style={{ display:"flex", alignItems:"center", gap:12, cursor:"pointer", padding:14 }}>
            <div style={{ width:36, height:36, borderRadius:10, background:"var(--soft)", display:"flex",alignItems:"center",justifyContent:"center" }}><Icon name={o.icon} size={17} color="var(--accent)" /></div>
            <div style={{ flex:1, fontFamily:"Inter", fontSize:14, fontWeight:600 }}>{o.label}</div>
            <Icon name="chevronR" size={17} color="var(--muted-2)" />
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ============================================================ ROOT APP */
function loadThemeSync() {
  try { return localStorage.getItem(THEME_KEY) === "dark"; } catch (e) { return false; }
}
function saveTheme(isDark) {
  try { localStorage.setItem(THEME_KEY, isDark ? "dark" : "light"); } catch (e) {}
}

const PERSON_KEY = "financeiro-casal:person-id";

function loadPersonSync() {
  try { return localStorage.getItem(PERSON_KEY); } catch (e) { return null; }
}

function FinanceApp() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("inicio");
  const [date, setDate] = useState(new Date());
  const [notifOpen, setNotifOpen] = useState(false);
  const [isDark, setIsDark] = useState(loadThemeSync);
  const [myPersonId, setMyPersonIdState] = useState(loadPersonSync);
  const saveTimer = useRef(null);

  useEffect(() => { loadData().then(setData); }, []);
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState(new Date());

  async function reloadFromCloud() {
    setSyncing(true);
    try {
      const fresh = await loadData();
      setData(fresh);
      setLastSync(new Date());
    } finally {
      setSyncing(false);
    }
  }

  function toggleTheme() {
    setIsDark(prev => { const next = !prev; saveTheme(next); return next; });
  }

  function choosePerson(id) {
    try { localStorage.setItem(PERSON_KEY, id); } catch (e) {}
    setMyPersonIdState(id);
  }
  function switchPerson() {
    try { localStorage.removeItem(PERSON_KEY); } catch (e) {}
    setMyPersonIdState(null);
    setTab("inicio");
  }

  function patch(fn) {
    setData(prev => {
      const next = fn(prev);
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => saveData(next), 400);
      return next;
    });
  }

  if (!data) {
    return (
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          height: "100vh",
          width: "100%",
          fontFamily: "Inter",
          color: "#8a897f",
        }}
      >
        Carregando...
      </div>
    );
  }

  const myPerson = data.people.find(p => p.id === myPersonId) || null;
  syncCustomBanks(data.customBanks);

  // Tela "quem é você" — aparece uma vez por dispositivo, ou se o dispositivo escolher trocar.
  if (!myPersonId || !myPerson) {
    return (
      <div className="fin-app" data-theme={isDark ? "dark" : "light"} style={{ fontFamily: "Inter, sans-serif", color: "var(--ink)", width: "100%", maxWidth: 430, margin: "0 auto", background: "var(--bg)", height: "100dvh", paddingTop: "calc(env(safe-area-inset-top) + 24px)", paddingLeft: 24, paddingRight: 24, paddingBottom: 24, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", boxSizing: "border-box", position: "relative", overflow: "hidden", boxShadow: "0 20px 60px -20px rgba(16,24,40,0.4)" }}>
        <style>{FONT_IMPORT}{THEME_CSS}{`* { box-sizing: border-box; }`}</style>
        <div style={{ fontFamily: "Source Serif 4, serif", fontSize: 24, fontWeight: 600, color: "var(--accent)", marginBottom: 6, textAlign: "center" }}>Quem é você?</div>
        <div style={{ fontFamily: "Inter", fontSize: 13.5, color: "var(--muted)", marginBottom: 28, textAlign: "center" }}>
          Esse aparelho vai lembrar essa escolha. Assim dá pra saber quem lançou o quê.
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%", maxWidth: 320 }}>
          {data.people.map(p => (
            <button key={p.id} onClick={() => choosePerson(p.id)} style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", borderRadius: 16, border: "1.5px solid var(--border)", background: "var(--card)", cursor: "pointer" }}>
              <div style={{ width: 44, height: 44, borderRadius: "50%", background: "#16283D", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Source Serif 4, serif", fontSize: 18, fontWeight: 600, flexShrink: 0 }}>{p.name.slice(0,1)}</div>
              <div style={{ fontFamily: "Inter", fontSize: 15.5, fontWeight: 700, color: "var(--ink)" }}>{p.name}</div>
            </button>
          ))}
        </div>
        <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "var(--muted-2)", marginTop: 24, textAlign: "center" }}>
          Os nomes podem ser alterados depois em Conta → Editar perfil.
        </div>
      </div>
    );
  }

  const partner = data.people.find(p => p.id !== myPersonId);

  const TABS = [
    { key: "inicio", icon: "home", label: "Início" },
    { key: "lancamentos", icon: "list", label: "Lançamentos" },
    { key: "relatorios", icon: "chart", label: "Relatórios" },
    { key: "limites", icon: "target", label: "Limites" },
    { key: "conta", icon: "user", label: "Conta" },
  ];

  return (
    <div className="fin-app" data-theme={isDark ? "dark" : "light"} style={{ fontFamily: "Inter, sans-serif", color: "var(--ink)", width: "100%", maxWidth: 430, margin: "0 auto", background: "var(--bg)", height: "100dvh", paddingTop: "env(safe-area-inset-top)", display: "flex", flexDirection: "column", position: "relative", overflow: "hidden", boxShadow: "0 20px 60px -20px rgba(16,24,40,0.4)" }}>
      <style>{FONT_IMPORT}{THEME_CSS}{`* { box-sizing: border-box; } select { -webkit-appearance:none; appearance:none; }`}</style>

      <div style={{ position: "relative", flex: 1, minHeight: 0, overflowY: "auto", overflowX: "hidden", WebkitOverflowScrolling: "touch" }}>
        {tab === "inicio" && <Inicio data={data} patch={patch} goManage={() => setTab("conta_conexoes")} goCards={() => setTab("conta_cartoes")} setNotifOpen={setNotifOpen} onReload={reloadFromCloud} syncing={syncing} lastSync={lastSync} isDark={isDark} toggleTheme={toggleTheme} myPersonId={myPersonId} myPerson={myPerson} partnerName={partner?.name} />}
        {tab === "lancamentos" && <Lancamentos data={data} patch={patch} date={date} setDate={setDate} myPersonId={myPersonId} />}
        {tab === "relatorios" && <Relatorios data={data} date={date} setDate={setDate} />}
        {tab === "limites" && <Limites data={data} patch={patch} />}
        {(tab === "conta" || tab === "conta_conexoes" || tab === "conta_cartoes") && <Conta data={data} patch={patch} key={tab} isDark={isDark} toggleTheme={toggleTheme} initialScreen={tab === "conta_conexoes" ? "conexoes" : tab === "conta_cartoes" ? "cartoes" : "main"} myPersonId={myPersonId} myPerson={myPerson} switchPerson={switchPerson} />}

        <Sheet open={notifOpen} onClose={()=>setNotifOpen(false)} title="Notificações">
          {data.notifications.length === 0 && <div style={{ fontFamily:"Inter", fontSize:13.5, color:"var(--muted)" }}>Sem notificações.</div>}
          {data.notifications.map(n => (
            <div key={n.id} style={{ display:"flex", gap:10, padding:"10px 2px", borderBottom:"1px solid var(--border-2)" }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background: n.read ? "var(--border)" : "#A13D46", marginTop:5, flexShrink:0 }} />
              <div style={{ fontFamily:"Inter", fontSize:13.5, color:"var(--ink-soft)" }}>{n.text}</div>
            </div>
          ))}
        </Sheet>
      </div>

      {/* bottom nav */}
      <div style={{ flexShrink: 0, background: "var(--card)", borderTop: "1px solid var(--border-2)", display: "flex", padding: "8px 6px calc(8px + env(safe-area-inset-bottom))" }}>
        {TABS.map(t => {
          const active = tab === t.key || (t.key === "conta" && (tab === "conta_conexoes" || tab === "conta_cartoes"));
          return (
            <button key={t.key} onClick={() => setTab(t.key)} style={{ flex: 1, background: "transparent", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "6px 0", cursor: "pointer" }}>
              <Icon name={t.icon} color={active ? "var(--accent)" : "#A9A498"} size={21} />
              <div style={{ fontFamily: "Inter", fontSize: 10, fontWeight: 600, color: active ? "var(--accent)" : "#A9A498" }}>{t.label}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(FinanceApp));
</script>
<script>
  const source = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]], filename: "app.jsx" }).code;
  const s = document.createElement("script");
  s.text = compiled;
  document.body.appendChild(s);
</script>
</body>
</html>
