// Applies (sign=1) or reverses (sign=-1) a transaction's effect on account balance
// or credit card invoice. For installments, only the "live" parcel (the one being
// entered now) moves money — past/future parcels exist for records but don't
// double-count, since the past already happened and the future hasn't yet.
function applyTxEffect(d, tx, sign) {
  if (tx.installment && tx.installment.current !== tx.installment.liveAt) return d;
  if (tx.accountId) {
    return { ...d, accounts: d.accounts.map(a => a.id === tx.accountId ? { ...a, balance: a.balance + sign * tx.value } : a) };
  }
  if (tx.cardId) {
    const amt = Math.abs(tx.value);
    return { ...d, cards: d.cards.map(c => c.id === tx.cardId ? { ...c, invoice: c.invoice + sign * amt } : c) };
  }
  return d;
}

/* ============================================================
   ARMAZENAMENTO COMPARTILHADO (jsonbin.io — plano grátis)
   1. Crie uma conta em https://jsonbin.io
   2. Crie um "Bin" novo com o conteúdo {} e copie o Bin ID
   3. Em "API Keys", copie sua X-Master-Key
   4. Cole os dois valores abaixo
============================================================ */
const JSONBIN_ID = "COLOQUE_SEU_BIN_ID_AQUI";
const JSONBIN_KEY = "COLOQUE_SUA_X-MASTER-KEY_AQUI";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

// Adds fields introduced after a bin was first created, so older saved data
// keeps working without the person having to reset anything.
function migrateData(d) {
  let next = d;
  if (!next.people) {
    next = { ...next, people: [
      { id: "p1", name: next.profile?.name || "Pessoa 1", email: next.profile?.email || "", birthdate: next.profile?.birthdate || "" },
      { id: "p2", name: next.profile?.partnerName || "Pessoa 2", email: "", birthdate: "" },
    ] };
  }
  if (!next.tags) next = { ...next, tags: [] };
  if (!next.recurringTemplates) next = { ...next, recurringTemplates: [] };
  if (!next.customBanks) next = { ...next, customBanks: [] };
  if (!next.notifications) next = { ...next, notifications: [] };
  return next;
}

async function loadData() {
  try {
    const res = await fetch(`${JSONBIN_URL}/latest`, {
      headers: { "X-Master-Key": JSONBIN_KEY },
    });
    if (res.ok) {
      const json = await res.json();
      if (json && json.record && (json.record.people || json.record.profile)) return migrateData(json.record);
    }
  } catch (e) { console.error("Falha ao carregar dados da nuvem:", e); }
  const seed = seedData();
  await saveData(seed);
  return seed;
}
async function saveData(data) {
  try {
    await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
      body: JSON.stringify(data),
    });
  } catch (e) { console.error("Falha ao salvar dados na nuvem:", e); }
}

    case "cal": return <svg {...p}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>;
    case "arrowUp": return <svg {...p}><path d="M12 19V5M6 11l6-6 6 6"/></svg>;
    case "arrowDown": return <svg {...p}><path d="M12 5v14M18 13l-6 6-6-6"/></svg>;

};

/* ============================================================ SCREEN: INÍCIO */
function Inicio({ data, patch, goManage, goCards, setNotifOpen, onReload, syncing, lastSync, isDark, toggleTheme, myPersonId, myPerson, partnerName }) {
  const [faturasOpen, setFaturasOpen] = useState(false);
  const [partnerOpen, setPartnerOpen] = useState(false);
  const [lastSeenPartner, setLastSeenPartner] = useState(() => {
    try { return Number(localStorage.getItem("financeiro-casal:partner-seen")) || 0; } catch (e) { return 0; }
  });

  const saldoGeral = data.accounts.reduce((s, a) => s + a.balance, 0);
  const totalFaturas = data.cards.reduce((s, c) => s + c.invoice, 0);
  const unread = data.notifications.filter(n => !n.read).length;

  // Contas sem "dono" definido (cadastradas antes dessa função existir) aparecem
  // para todos, como sempre apareceram. Contas novas pertencem a quem cadastrou.
  const myAccounts = data.accounts.filter(a => !a.ownerId || a.ownerId === myPersonId);
  const partnerAccounts = data.accounts.filter(a => a.ownerId && a.ownerId !== myPersonId);

  const cardsByOwner = data.people.map(p => ({
    person: p,
    cards: data.cards.filter(c => c.ownerId === p.id),
  })).concat([{ person: null, cards: data.cards.filter(c => !c.ownerId) }])
    .filter(g => g.cards.length > 0);

  const partnerNew = data.transactions
    .filter(t => t.personId && t.personId !== myPersonId && (t.createdAt || 0) > lastSeenPartner)
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  function bankFor(t) {
    if (t.cardId) return data.cards.find(c => c.id === t.cardId)?.bank;
    if (t.accountId) return data.accounts.find(a => a.id === t.accountId)?.bank;
    return null;
  }
  const partnerBanks = [...new Set(partnerNew.map(bankFor).filter(Boolean))];

  function markPartnerSeen() {
    const now = Date.now();
    try { localStorage.setItem("financeiro-casal:partner-seen", String(now)); } catch (e) {}
    setLastSeenPartner(now);
    setPartnerOpen(false);
  }

  return (
    <div style={{ paddingBottom: 100 }}>
      {/* header */}
      <div style={{ padding: "22px 18px 8px", display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ width: 46, height: 46, borderRadius: "50%", background: "#16283D", color: "#FFFFFF", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Source Serif 4, serif", fontSize: 18, fontWeight: 600 }}>
          {(myPerson?.name || "?").slice(0,1)}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: "var(--label)", fontWeight: 600 }}>{greeting()}</div>
          <div style={{ fontFamily: "Source Serif 4, serif", fontSize: 19, fontWeight: 600, color: "var(--accent)" }}>{myPerson?.name || "Você"}</div>
        </div>
        <button onClick={toggleTheme} title={isDark ? "Modo claro" : "Modo escuro"} style={{ ...navBtn, width: 40, height: 40, background: "var(--soft)" }}>
          <Icon name={isDark ? "sun" : "moon"} color="var(--accent)" size={18} />
        </button>
        <button onClick={onReload} disabled={syncing} title="Recarregar lançamentos" style={{ ...navBtn, width: 40, height: 40, background: "var(--soft)" }}>
          <Icon name="refresh" color="var(--accent)" size={18} style={syncing ? { animation: "spin 0.9s linear infinite" } : {}} />
        </button>
        <button onClick={() => setNotifOpen(true)} style={{ ...navBtn, width: 40, height: 40, background: "var(--soft)", position: "relative" }}>
          <Icon name="bell" color="var(--accent)" size={19} />
          {unread > 0 && <span style={{ position: "absolute", top: 4, right: 5, width: 8, height: 8, borderRadius: "50%", background: "#A13D46" }} />}
        </button>
      </div>
      <div style={{ padding: "0 18px 4px", fontFamily: "Inter", fontSize: 11, color: "var(--muted-2)" }}>

      {/* saldo geral */}
      <div style={{ padding: "18px 18px 0" }}>
        <Card style={{ background: "#16283D", color: "#FFFFFF" }}>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: "#AAB8C4", fontWeight: 600, marginBottom: 4 }}>Saldo geral (vocês dois)</div>
          <div style={{ fontFamily: "Source Serif 4, serif", fontSize: 30, fontWeight: 600 }}>{brl(saldoGeral)}</div>
          <div style={{ marginTop: 8, height: 1, background: "repeating-linear-gradient(90deg,#3A5066 0 6px,transparent 6px 12px)" }} />
        </Card>

      {/* saldo por pessoa */}
      <div style={{ padding: "10px 18px 0", display: "flex", gap: 8 }}>
        {data.people.map(p => {
          const accts = data.accounts.filter(a => a.ownerId === p.id || (!a.ownerId && p.id === myPersonId));
          const subtotal = accts.reduce((s,a)=>s+a.balance, 0);
          return (
            <Card key={p.id} style={{ flex: 1, padding: 12 }}>
              <div style={{ fontFamily: "Inter", fontSize: 11, color: "var(--muted-2)", fontWeight: 700, marginBottom: 4 }}>{p.id === myPersonId ? "Você" : p.name}</div>

      {/* contas */}
      <div style={{ padding: "16px 18px 0" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>

          <button onClick={goManage} style={{ border: "none", background: "transparent", color: "var(--accent)", fontFamily: "Inter", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>Gerenciar contas ›</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {myAccounts.map(a => (

          {myAccounts.length === 0 && (
            <Card><div style={{ fontFamily: "Inter", fontSize: 13.5, color: "var(--muted)" }}>Nenhuma conta sua cadastrada ainda. Toque em "Gerenciar contas" pra adicionar.</div></Card>
          )}
        </div>

        {partnerAccounts.length > 0 && (
          <>
            <div style={{ fontFamily: "Inter", fontSize: 11.5, letterSpacing: 1, textTransform: "uppercase", color: "var(--muted-2)", fontWeight: 700, margin: "14px 0 8px" }}>Contas de {partnerName}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {partnerAccounts.map(a => (
                <Card key={a.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: 12, opacity: 0.85 }}>

                  <div style={{ flex: 1 }}>

      {/* faturas */}
      {data.cards.length > 0 && (
        <div style={{ padding: "16px 18px 0" }}>
          <div style={{ fontFamily: "Inter", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: "var(--label)", fontWeight: 700, marginBottom: 8 }}>Faturas em aberto</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {cardsByOwner.map(g => (
              <div key={g.person?.id || "sem-dono"}>
                <div style={{ fontFamily: "Inter", fontSize: 12.5, fontWeight: 700, color: "var(--ink)", marginBottom: 6 }}>Fatura Atual {g.person ? (g.person.id === myPersonId ? "Você" : g.person.name) : ""}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {g.cards.map(c => {
                    const disponivel = c.limit - c.invoice;
                    return (
                      <Card key={c.id} onClick={() => setFaturasOpen(true)} style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }}>
                        <BankBadge bank={c.bank} size={36} />
                        <div style={{ flex: 1 }}>
                          <div style={{ fontFamily: "Inter", fontSize: 13, fontWeight: 700 }}>{allBanks()[c.bank]?.name || c.bank}</div>
                          <div style={{ fontFamily: "IBM Plex Mono", fontSize: 16, fontWeight: 600, color: "var(--accent)" }}>{brl(c.invoice)}</div>

                      </Card>

      <Sheet open={faturasOpen} onClose={() => setFaturasOpen(false)} title="Faturas em aberto">
        {cardsByOwner.map(g => {
          const subtotal = g.cards.reduce((s,c) => s + c.invoice, 0);
          return (
            <div key={g.person?.id || "sem-dono"} style={{ marginBottom: 16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom: 8 }}>
                <div style={{ fontFamily: "Inter", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: "var(--label)", fontWeight: 700 }}>
                  {g.person ? `Faturas de ${g.person.name}` : "Outras faturas"}
                </div>
                <div style={{ fontFamily: "IBM Plex Mono", fontSize: 13, fontWeight: 700, color: "var(--accent)" }}>{brl(subtotal)}</div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {g.cards.map(c => (
                  <Card key={c.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: 12 }}>

                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 700 }}>{c.name}</div>
                      <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "var(--muted-2)" }}>Vence dia {c.dueDay}</div>
                    </div>
                    <div style={{ fontFamily: "IBM Plex Mono", fontSize: 15, fontWeight: 600, color: "var(--accent)" }}>{brl(c.invoice)}</div>
                  </Card>
                ))}
              </div>
            </div>
          );
        })}
        <button onClick={() => { setFaturasOpen(false); goCards(); }} style={primaryBtn}>Ver todos os cartões</button>
      </Sheet>
    </div>
  );
}
const primaryBtn = { width: "100%", padding: "13px", borderRadius: 13, border: "none", background: "#16283D", color: "#FFFFFF", fontFamily: "Inter", fontWeight: 700, fontSize: 14.5, cursor: "pointer" };

const secondaryBtn = { width: "100%", padding: "13px", borderRadius: 13, border: "1.5px solid #A13D46", background: "transparent", color: "#A13D46", fontFamily: "Inter", fontWeight: 700, fontSize: 14.5, cursor: "pointer" };

/* ============================================================ SCREEN: LANÇAMENTOS (fluxo de caixa) */
const blankNewTx = () => ({
  desc: "", value: "", type: "despesa", category: DESPESA_CATS[0], accountId: "",
  paymentMethod: "conta", cardId: "",
  date: todayISO(), repeatType: "none", // none | installment | fixed
  totalParcelas: 2, currentParcela: 1, repeatMonths: 12, fixedMode: "months", tag: "",
});

const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const keyToDate = (key, day) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, day); };

const PAYMENT_METHODS = [
  ["conta", "Conta (débito)"], ["cartao", "Cartão de crédito"], ["pix", "Pix"],
  ["vale_alimentacao", "Vale Alimentação"], ["vale_refeicao", "Vale Refeição"],
];
const paymentLabel = (m) => (PAYMENT_METHODS.find(p => p[0] === m) || [,""])[1];

function Lancamentos({ data, patch, date, setDate, myPersonId }) {
  const myAccounts = data.accounts.filter(a => !a.ownerId || a.ownerId === myPersonId);
  const myCards = data.cards.filter(c => !c.ownerId || c.ownerId === myPersonId);
  const [menuOpen, setMenuOpen] = useState(false);
  const [mode, setMode] = useState("normal"); // normal | select | search | filter | period
  const [selected, setSelected] = useState([]);
  const [query, setQuery] = useState("");
  const [filters, setFilters] = useState({ types: [], status: [], accounts: [], categories: [] });
  const [period, setPeriod] = useState("mes");
  const [newTxOpen, setNewTxOpen] = useState(false);
  const [newTx, setNewTx] = useState(blankNewTx());
  const [editingId, setEditingId] = useState(null);
  const [actionFor, setActionFor] = useState(null); // tx tapped for quick actions
  const [fixedSheetOpen, setFixedSheetOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [importRows, setImportRows] = useState([]);
  const [importCardId, setImportCardId] = useState("");

  function parseCsvLine(line) {
    const out = []; let cur = ""; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { q = !q; }
      else if (ch === "," && !q) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out;
  }

  function handleCsvFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const lines = String(reader.result).split(/\r?\n/).filter(l => l.trim());
      const rows = lines.slice(1).map(line => {
        const [date, title, amountRaw] = parseCsvLine(line);
        if (!date || !title) return null;
        const amount = parseFloat((amountRaw || "0").replace(/\./g, "").replace(",", "."));
        const m = title.match(/^(.*?)\s*-\s*Parcela\s*(\d+)\s*\/\s*(\d+)\s*$/i);
        const desc = m ? m[1].trim() : title.trim();
        const current = m ? parseInt(m[2]) : null;
        const total = m ? parseInt(m[3]) : null;
        const importKey = `${date}|${title}|${amount}`;
        const groupKey = m ? `INST|${desc}|${total}|${amount}` : null;
        const already = groupKey
          ? data.transactions.some(t => t.importGroupKey === groupKey)
          : data.transactions.some(t => t.importKey === importKey);
        return { date, title, desc, amount, current, total, importKey, groupKey, already, checked: !already };
      }).filter(Boolean);
      setImportRows(rows);
    };
    reader.readAsText(file, "utf-8");
  }

  function toggleImportRow(i) { setImportRows(rows => rows.map((r,idx) => idx===i ? { ...r, checked: !r.checked } : r)); }

  function doImport() {
    if (!importCardId) return;
    const toImport = importRows.filter(r => r.checked && !r.already);
    const news = [];
    toImport.forEach(r => {
      const common = { type: "despesa", category: "Outros", accountId: null, cardId: importCardId, tag: "", paymentMethod: "cartao", personId: myPersonId, createdAt: Date.now(), importKey: r.importKey, importGroupKey: r.groupKey };
      if (r.total) {
        const groupId = uid();
        const base = parseLocalDate(r.date);
        for (let i = 1; i <= r.total; i++) {
          const offset = i - r.current;
          const d2 = new Date(base.getFullYear(), base.getMonth() + offset, base.getDate());
          news.push({ id: uid(), date: toISO(d2), desc: r.desc, value: -r.amount, status: i <= r.current ? "resolvido" : "pendente", fixed: false, installment: { groupId, current: i, total: r.total, liveAt: r.current }, ...common });
        }
      } else {
        news.push({ id: uid(), date: r.date, desc: r.desc, value: -r.amount, status: "resolvido", fixed: false, ...common });
      }
    });
    patch(d => {
      let next = { ...d, transactions: [...news, ...d.transactions] };
      news.forEach(t => { next = applyTxEffect(next, t, 1); });
      return next;
    });
    setImportOpen(false);
    setImportRows([]);
  }


  function openNew() { setNewTx(blankNewTx()); setEditingId(null); setNewTxOpen(true); }
  function openEdit(tx) {
    setNewTx({
      desc: tx.desc, value: String(Math.abs(tx.value)), type: tx.type, category: tx.category,
      accountId: tx.accountId || "", paymentMethod: tx.cardId ? "cartao" : (tx.paymentMethod || "conta"),
      cardId: tx.cardId || "", date: tx.date, repeatType: "none",
      totalParcelas: 2, currentParcela: 1, repeatMonths: 12, tag: tx.tag || "",
    });
    setEditingId(tx.id);
    setActionFor(null);
    setNewTxOpen(true);
  }
  function deleteOne(tx) {
    patch(d => {
      const next = applyTxEffect(d, tx, -1);
      return { ...next, transactions: next.transactions.filter(t => t.id !== tx.id) };
    });
    setActionFor(null);
  }

  function saveNewTx() {
    if (!newTx.desc || !newTx.value) return;
    const totalVal = parseFloat(newTx.value);
    if (!totalVal) return;
    const viaCard = newTx.type === "despesa" && newTx.paymentMethod === "cartao";
    const accountId = viaCard ? null : (["conta", "pix"].includes(newTx.paymentMethod) ? (newTx.accountId || myAccounts[0]?.id || null) : null);
    const cardId = viaCard ? (newTx.cardId || myCards[0]?.id || null) : null;
    const common = { type: newTx.type, category: newTx.category, accountId, cardId, tag: newTx.tag || "", paymentMethod: newTx.paymentMethod, personId: myPersonId, createdAt: Date.now() };

    if (editingId) {
      patch(d => {
        const old = d.transactions.find(t => t.id === editingId);
        if (!old) return d;
        let next = applyTxEffect(d, old, -1);
        const updated = { ...old, desc: newTx.desc, date: newTx.date, value: newTx.type === "despesa" ? -Math.abs(totalVal) : Math.abs(totalVal), ...common };
        next = { ...next, transactions: next.transactions.map(t => t.id === editingId ? updated : t) };
        next = applyTxEffect(next, updated, 1);
        return next;
      });
      setEditingId(null);
    } else if (newTx.repeatType === "installment") {
      const parcelas = Math.max(1, parseInt(newTx.totalParcelas) || 1);
      const atual = Math.min(parcelas, Math.max(1, parseInt(newTx.currentParcela) || 1));
      const valorParcela = totalVal / parcelas;
      const groupId = uid();
      const base = new Date(newTx.date + "T00:00:00");
      const novas = [];
      for (let i = 1; i <= parcelas; i++) {
        const offset = i - atual;
        const d2 = new Date(base.getFullYear(), base.getMonth() + offset, base.getDate());
        novas.push({
          id: uid(), date: toISO(d2), desc: newTx.desc,
          value: newTx.type === "despesa" ? -valorParcela : valorParcela,
          status: i <= atual ? "resolvido" : "pendente", fixed: false,
          installment: { groupId, current: i, total: parcelas, liveAt: atual }, ...common,
        });
      }
      patch(d => {
        let next = { ...d, transactions: [...novas, ...d.transactions] };
        novas.forEach(t => { next = applyTxEffect(next, t, 1); });
        return next;
      });
    } else if (newTx.repeatType === "fixed") {
      const base = new Date(newTx.date + "T00:00:00");
      const startKey = monthKey(base);
      const templateId = uid();
      const template = {
        id: templateId, desc: newTx.desc, value: Math.abs(totalVal), day: base.getDate(),
        startMonth: startKey, mode: newTx.fixedMode, totalMonths: newTx.fixedMode === "months" ? Math.max(1, parseInt(newTx.repeatMonths) || 12) : null,
        active: true, confirmedMonths: [startKey], skippedMonths: [], ...common,
      };
      const t = { id: uid(), date: newTx.date, desc: newTx.desc, value: newTx.type === "despesa" ? -Math.abs(totalVal) : Math.abs(totalVal), status: "resolvido", fixed: true, recurringId: templateId, ...common };
      patch(d => applyTxEffect({ ...d, transactions: [t, ...d.transactions], recurringTemplates: [...(d.recurringTemplates || []), template] }, t, 1));
    } else {
      const t = { id: uid(), date: newTx.date, desc: newTx.desc, value: newTx.type === "despesa" ? -Math.abs(totalVal) : Math.abs(totalVal), status: "resolvido", fixed: false, ...common };
      patch(d => applyTxEffect({ ...d, transactions: [t, ...d.transactions] }, t, 1));
    }
    setNewTxOpen(false);
    setNewTx(blankNewTx());
  }

  const monthTx = useMemo(() => data.transactions.filter(t => {
    const d = parseLocalDate(t.date);
    return d.getFullYear() === date.getFullYear() && d.getMonth() === date.getMonth();
  }), [data.transactions, date]);

  const viewedKey = monthKey(date);
  const pendingFixed = useMemo(() => (data.recurringTemplates || []).filter(t => {
    if (!t.active) return false;
    if (t.confirmedMonths.includes(viewedKey) || t.skippedMonths.includes(viewedKey)) return false;
    if (viewedKey < t.startMonth) return false;
    if (t.mode === "months") {
      const [sy, sm] = t.startMonth.split("-").map(Number);
      const [vy, vm] = viewedKey.split("-").map(Number);
      const idx = (vy - sy) * 12 + (vm - sm);
      if (idx >= t.totalMonths) return false;
    }
    return true;
  }), [data.recurringTemplates, viewedKey]);

  function confirmFixed(tpl) {
    const d2 = keyToDate(viewedKey, tpl.day);
    const t = { id: uid(), date: toISO(d2), desc: tpl.desc, value: tpl.type === "despesa" ? -Math.abs(tpl.value) : Math.abs(tpl.value), status: "resolvido", fixed: true, recurringId: tpl.id, type: tpl.type, category: tpl.category, accountId: tpl.accountId, cardId: tpl.cardId, tag: tpl.tag, paymentMethod: tpl.paymentMethod, personId: tpl.personId, createdAt: Date.now() };
    patch(d => applyTxEffect({
      ...d,
      transactions: [t, ...d.transactions],
      recurringTemplates: (d.recurringTemplates||[]).map(x => x.id === tpl.id ? { ...x, confirmedMonths: [...x.confirmedMonths, viewedKey] } : x),
    }, t, 1));
  }
  function skipFixed(tpl) {
    patch(d => ({ ...d, recurringTemplates: (d.recurringTemplates||[]).map(x => x.id === tpl.id ? { ...x, skippedMonths: [...x.skippedMonths, viewedKey] } : x) }));
  }
  function cancelFixed(tpl) {
    patch(d => ({ ...d, recurringTemplates: (d.recurringTemplates||[]).map(x => x.id === tpl.id ? { ...x, active: false } : x) }));
  }

  const filtered = useMemo(() => monthTx.filter(t => {
    if (query && !t.desc.toLowerCase().includes(query.toLowerCase())) return false;
    const kindFilters = filters.types.filter(v => ["receita","despesa","transferencia"].includes(v));
    if (kindFilters.length && !kindFilters.includes(t.type)) return false;
    if (filters.types.includes("fixo") && !t.fixed) return false;
    if (filters.types.includes("parcelado") && !t.installment) return false;
    if (filters.status.length && !filters.status.includes(t.status)) return false;
    if (filters.accounts.length && !filters.accounts.includes(t.accountId)) return false;
    if (filters.categories.length && !filters.categories.includes(t.category)) return false;
    return true;
  }), [monthTx, query, filters]);

  const grouped = useMemo(() => {
    const g = {};
    filtered.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(t => { (g[t.date] ||= []).push(t); });
    return Object.entries(g);
  }, [filtered]);

  const total = filtered.reduce((s,t)=>s+t.value,0);
  const selTotal = data.transactions.filter(t=>selected.includes(t.id)).reduce((s,t)=>s+t.value,0);

  function toggleSel(id) { setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]); }
  function deleteSelected() {
    patch(d => {
      const toRemove = d.transactions.filter(t => selected.includes(t.id));
      let next = d;
      toRemove.forEach(t => { next = applyTxEffect(next, t, -1); });
      return { ...next, transactions: next.transactions.filter(t => !selected.includes(t.id)) };
    });
    setSelected([]); setMode("normal");
  }
  function allIds() { return filtered.map(t=>t.id); }

  const allCats = [...DESPESA_CATS, ...RECEITA_CATS];

  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 18px 0" }}>
        {mode === "select" ? (
          <>
            <button onClick={() => { setMode("normal"); setSelected([]); }} style={{ ...navBtn, background: "transparent" }}><Icon name="x" color="var(--ink-soft)" /></button>
            <div style={{ fontFamily: "Inter", fontWeight: 700, fontSize: 14 }}>{selected.length} selecionado(s)</div>
            <button onClick={() => setSelected(selected.length === allIds().length ? [] : allIds())} style={{ fontFamily: "Inter", fontSize: 12.5, fontWeight: 700, color: "var(--accent)", background: "transparent", border: "none", cursor: "pointer" }}>Marcar todos</button>
          </>
        ) : (
          <>
            <div style={{ fontFamily: "Inter", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: "var(--label)", fontWeight: 700 }}>Fluxo de caixa</div>
            <button onClick={() => setMenuOpen(true)} style={{ ...navBtn, background: "transparent" }}><Icon name="dots" color="var(--ink-soft)" /></button>
          </>
        )}
      </div>

      <MonthBar date={date} setDate={setDate} />

      {pendingFixed.length > 0 && (
        <div style={{ padding: "0 18px 10px" }}>
          <Card onClick={() => setFixedSheetOpen(true)} style={{ display: "flex", alignItems: "center", gap: 12, padding: 12, cursor: "pointer", background: "var(--soft)" }}>
            <Icon name="cal" size={20} color="var(--accent)" />
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 700, color: "var(--ink)" }}>{pendingFixed.length} gasto(s) fixo(s) esse mês</div>
              <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "var(--muted-2)" }}>Toque pra confirmar ou pular</div>
            </div>
            <Icon name="chevronR" size={18} color="var(--accent)" />
          </Card>
        </div>
      )}

      <Sheet open={fixedSheetOpen} onClose={() => setFixedSheetOpen(false)} title="Gastos fixos do mês">
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {pendingFixed.map(tpl => (
            <Card key={tpl.id} style={{ padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                <div>
                  <div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 700 }}>{tpl.desc}</div>
                  <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "var(--muted-2)" }}>{tpl.category} · dia {tpl.day}</div>
                </div>
                <div style={{ fontFamily: "IBM Plex Mono", fontSize: 14, fontWeight: 600, color: tpl.type === "receita" ? "#1E7F63" : "#A13D46" }}>{brl(tpl.type === "receita" ? tpl.value : -tpl.value)}</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => confirmFixed(tpl)} style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", background: "#16283D", color: "#fff", fontFamily: "Inter", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Lançar esse mês</button>
                <button onClick={() => skipFixed(tpl)} style={{ flex: 1, padding: "9px", borderRadius: 10, border: "1.5px solid var(--border)", background: "transparent", color: "var(--muted)", fontFamily: "Inter", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Pular esse mês</button>
              </div>
              <button onClick={() => cancelFixed(tpl)} style={{ width: "100%", marginTop: 8, padding: "6px", border: "none", background: "transparent", color: "#A13D46", fontFamily: "Inter", fontWeight: 600, fontSize: 11.5, cursor: "pointer" }}>Cancelar essa recorrência</button>
            </Card>
          ))}
        </div>
      </Sheet>

      {mode === "search" && (
        <div style={{ padding: "0 18px 10px" }}>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ flex: 1, position: "relative" }}>
              <input autoFocus placeholder="Buscar por descrição..." value={query} onChange={e=>setQuery(e.target.value)} style={{ ...inputStyle, paddingLeft: 36 }} />
              <div style={{ position: "absolute", left: 11, top: 11 }}><Icon name="search" size={16} color="var(--muted-2)" /></div>
            </div>
            <button onClick={() => { setMode("normal"); setQuery(""); }} style={{ ...navBtn, background: "var(--soft)" }}><Icon name="x" size={16} color="var(--accent)" /></button>
          </div>
        </div>
      )}

      <div style={{ padding: "6px 18px 0", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "var(--muted-2)" }}>{filtered.length} lançamento(s)</div>
        <div style={{ fontFamily: "IBM Plex Mono", fontSize: 15, fontWeight: 600, color: total >= 0 ? "#1E7F63" : "#A13D46" }}>{brl(total)}</div>
      </div>

      <div style={{ padding: "10px 18px 0" }}>
        {grouped.length === 0 && <Card><div style={{ fontFamily: "Inter", fontSize: 13.5, color: "var(--muted)" }}>Nenhum lançamento neste período.</div></Card>}
        {grouped.map(([d, items]) => (
          <div key={d} style={{ marginBottom: 14 }}>
            <div style={{ fontFamily: "IBM Plex Mono", fontSize: 11.5, color: "var(--muted-2)", marginBottom: 6 }}>{parseLocalDate(d).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" })}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {items.map(t => (
                <Card key={t.id} onClick={() => mode === "select" ? toggleSel(t.id) : setActionFor(t)}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: 12, cursor: "pointer",
                    border: selected.includes(t.id) ? "1.5px solid var(--accent)" : "1.5px solid transparent" }}>
                  {mode === "select" && (
                    <div style={{ width: 20, height: 20, borderRadius: 6, border: "1.5px solid var(--accent)", background: selected.includes(t.id) ? "var(--accent)" : "transparent", display:"flex",alignItems:"center",justifyContent:"center", flexShrink:0 }}>
                      {selected.includes(t.id) && <Icon name="check" size={13} color="#fff" />}
                    </div>
                  )}
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: t.type==="despesa"?"#A13D46":t.type==="receita"?"#1E7F63":"#A9834B", flexShrink:0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: "Inter", fontSize: 13.5, fontWeight: 600, overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{t.desc}{t.installment && ` (${t.installment.current}/${t.installment.total})`}</div>
                    <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "var(--muted-2)" }}>{t.category} {t.status === "pendente" && "· Pendente"} {t.fixed && "· Fixo"} {t.installment && "· Parcelado"}</div>
                  </div>
                  <div style={{ fontFamily: "IBM Plex Mono", fontSize: 14, fontWeight: 600, color: t.value >= 0 ? "#1E7F63" : "#A13D46" }}>{brl(t.value)}</div>
                </Card>
              ))}
            </div>
          </div>
        ))}
      </div>

      {/* menu de 3 pontos */}
      <Sheet open={menuOpen} onClose={() => setMenuOpen(false)}>
        {[
          { icon: "check", label: "Selecionar", act: () => setMode("select") },
          { icon: "search", label: "Pesquisar", act: () => setMode("search") },
          { icon: "filter", label: "Filtrar", act: () => setMode("filter") },
          { icon: "cal", label: "Alterar período de visualização", act: () => setMode("period") },
          { icon: "upload", label: "Importar CSV (Nubank)", act: () => setImportOpen(true) },
        ].map(o => (
          <div key={o.label} onClick={() => { o.act(); setMenuOpen(false); }} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 4px", cursor:"pointer", borderBottom:"1px solid var(--border-2)" }}>
            <Icon name={o.icon} color="var(--accent)" size={19} />
            <div style={{ fontFamily:"Inter", fontSize:14.5, fontWeight:600, color:"var(--ink-soft)" }}>{o.label}</div>
          </div>
        ))}
      </Sheet>

      {/* filtro */}
      <Sheet open={mode === "filter"} onClose={() => setMode("normal")} title="Filtrar">
        {[
          { key: "types", label: "Tipo", opts: [["receita","Receita"],["despesa","Despesa"],["transferencia","Transferência"],["fixo","Lançamentos fixos"],["parcelado","Lançamentos parcelados"]] },
          { key: "status", label: "Situação", opts: [["pendente","Pendente"],["resolvido","Resolvido"]] },
          { key: "accounts", label: "Contas", opts: data.accounts.map(a=>[a.id,a.name]) },
        ].map(group => (
          <div key={group.key} style={{ marginBottom: 16 }}>
            <div style={{ fontFamily:"Inter", fontSize:12, fontWeight:700, color:"var(--muted)", marginBottom:8 }}>{group.label}</div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
              {group.opts.map(([val,lab]) => (
                <Pill key={val} active={filters[group.key]?.includes(val)} onClick={() => setFilters(f => ({ ...f, [group.key]: (f[group.key]||[]).includes(val) ? f[group.key].filter(x=>x!==val) : [...(f[group.key]||[]), val] }))}>{lab}</Pill>
              ))}
            </div>
          </div>
        ))}
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontFamily:"Inter", fontSize:12, fontWeight:700, color:"var(--muted)", marginBottom:8 }}>Categorias</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, maxHeight: 140, overflowY:"auto" }}>
            {allCats.map(c => (
              <Pill key={c} active={filters.categories.includes(c)} onClick={() => setFilters(f => ({ ...f, categories: f.categories.includes(c) ? f.categories.filter(x=>x!==c) : [...f.categories, c] }))}>{c}</Pill>
            ))}
          </div>
        </div>
        <button onClick={() => setMode("normal")} style={primaryBtn}>Aplicar filtros</button>
      </Sheet>

      {/* período */}
      <Sheet open={mode === "period"} onClose={() => setMode("normal")} title="Alterar período de visualização">
        {[["hoje","Hoje"],["mes","Mês atual"],["ano","Este ano"],["7d","Últimos 7 dias"],["15d","Últimos 15 dias"],["30d","Últimos 30 dias"],["custom","Período personalizado"]].map(([val,lab]) => (
          <label key={val} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 4px", cursor:"pointer" }}>
            <div onClick={()=>setPeriod(val)} style={{ width: 20, height: 20, borderRadius: 6, border: "1.5px solid var(--accent)", background: period===val ? "var(--accent)":"transparent", display:"flex",alignItems:"center",justifyContent:"center" }}>
              {period===val && <Icon name="check" size={13} color="#fff" />}
            </div>
            <div style={{ fontFamily:"Inter", fontSize:14 }}>{lab}</div>
          </label>
        ))}
        <button onClick={() => setMode("normal")} style={{ ...primaryBtn, marginTop: 10 }}>Aplicar</button>
      </Sheet>

      {/* botão flutuante novo lançamento */}
      {mode === "normal" && (
        <button onClick={openNew} style={{ position: "fixed", right: "max(18px, calc(50% - 197px))", bottom: "calc(78px + env(safe-area-inset-bottom))", width: 52, height: 52, borderRadius: "50%", border: "none", background: "#16283D", boxShadow: "0 10px 24px -8px rgba(22,40,61,0.55)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", zIndex: 30 }}>
          <Icon name="plus" color="#fff" size={22} />
        </button>
      )}

      <Sheet open={newTxOpen} onClose={() => { setNewTxOpen(false); setEditingId(null); }} title={editingId ? "Editar lançamento" : "Novo lançamento"} large>
        <Field label="Tipo">
          <div style={{ display: "flex", gap: 8 }}>
            {[["despesa","Despesa"],["receita","Receita"],["transferencia","Transferência"]].map(([v,l]) => (
              <Pill key={v} active={newTx.type===v} onClick={() => setNewTx({ ...newTx, type: v, category: v==="receita"?RECEITA_CATS[0]:DESPESA_CATS[0] })}>{l}</Pill>
            ))}
          </div>
        </Field>
        <Field label="Descrição"><input style={inputStyle} placeholder="Ex: Panela elétrica" value={newTx.desc} onChange={e => setNewTx({ ...newTx, desc: e.target.value })} /></Field>
        <Field label={newTx.repeatType === "installment" ? "Valor total da compra" : "Valor"}><input style={inputStyle} type="number" placeholder="0,00" value={newTx.value} onChange={e => setNewTx({ ...newTx, value: e.target.value })} /></Field>
        <Field label="Categoria">
          <select style={inputStyle} value={newTx.category} onChange={e => setNewTx({ ...newTx, category: e.target.value })}>
            {(newTx.type === "receita" ? RECEITA_CATS : DESPESA_CATS).map(c => <option key={c}>{c}</option>)}
          </select>
        </Field>
        {newTx.type === "despesa" && (
          <Field label="Forma de pagamento">
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {PAYMENT_METHODS.map(([v,l]) => (
                <Pill key={v} active={newTx.paymentMethod === v} onClick={() => setNewTx({ ...newTx, paymentMethod: v })}>{l}</Pill>
              ))}
            </div>
          </Field>
        )}
        {newTx.type === "despesa" && newTx.paymentMethod === "cartao" && (
          <Field label="Cartão">
            <select style={inputStyle} value={newTx.cardId} onChange={e => setNewTx({ ...newTx, cardId: e.target.value })}>
              <option value="">Selecione</option>
              {myCards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
        )}
        {(newTx.type !== "despesa" || ["conta","pix"].includes(newTx.paymentMethod)) && (
          <Field label="Conta">
            <select style={inputStyle} value={newTx.accountId} onChange={e => setNewTx({ ...newTx, accountId: e.target.value })}>
              <option value="">Selecione</option>
              {myAccounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </Field>
        )}
        {newTx.type === "despesa" && ["vale_alimentacao","vale_refeicao"].includes(newTx.paymentMethod) && (
          <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "var(--muted-2)", marginBottom: 14 }}>
            Esse lançamento fica registrado com a forma de pagamento "{paymentLabel(newTx.paymentMethod)}" para relatórios, mas não desconta de nenhuma conta (ainda não temos um saldo de vale cadastrado no app).
          </div>
        )}
        <Field label={newTx.repeatType === "installment" ? "Data desta parcela" : "Data"}><input style={{ ...inputStyle, maxWidth: "100%" }} type="date" value={newTx.date} onChange={e => setNewTx({ ...newTx, date: e.target.value })} /></Field>

        {!editingId && (
          <Field label="Repetição">
            <div style={{ display: "flex", gap: 8 }}>
              <Pill active={newTx.repeatType === "none"} onClick={() => setNewTx({ ...newTx, repeatType: "none" })}>Única vez</Pill>
              <Pill active={newTx.repeatType === "installment"} onClick={() => setNewTx({ ...newTx, repeatType: "installment" })}>Parcelado</Pill>
              <Pill active={newTx.repeatType === "fixed"} onClick={() => setNewTx({ ...newTx, repeatType: "fixed" })}>Fixo (recorrente)</Pill>
            </div>
          </Field>
        )}

        {!editingId && newTx.repeatType === "installment" && (
          <div style={{ background: "var(--soft)", borderRadius: 14, padding: 14, marginBottom: 14 }}>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <Field label="Total de parcelas"><input style={inputStyle} type="number" min="1" value={newTx.totalParcelas} onChange={e => setNewTx({ ...newTx, totalParcelas: e.target.value, currentParcela: Math.min(parseInt(newTx.currentParcela)||1, parseInt(e.target.value)||1) })} /></Field>
              </div>
              <div style={{ flex: 1 }}>
                <Field label="Qual parcela é esta?"><input style={inputStyle} type="number" min="1" max={newTx.totalParcelas} value={newTx.currentParcela} onChange={e => setNewTx({ ...newTx, currentParcela: e.target.value })} /></Field>
              </div>
            </div>
            {newTx.value && newTx.totalParcelas > 0 && (
              <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "var(--muted)" }}>
                {parseInt(newTx.totalParcelas) || 0}x de {brl((parseFloat(newTx.value)||0)/(parseInt(newTx.totalParcelas)||1))}. Vamos lançar a parcela {newTx.currentParcela} em {newTx.date?.split("-").reverse().join("/")}, gerando automaticamente as parcelas anteriores (já pagas) e as seguintes (pendentes) nos meses corretos.
              </div>
            )}
          </div>
        )}

        {!editingId && newTx.repeatType === "fixed" && (
          <div style={{ background: "var(--soft)", borderRadius: 14, padding: 14, marginBottom: 14 }}>
            <Field label="Duração">
              <div style={{ display: "flex", gap: 8 }}>
                <Pill active={newTx.fixedMode === "months"} onClick={() => setNewTx({ ...newTx, fixedMode: "months" })}>Por tempo determinado</Pill>
                <Pill active={newTx.fixedMode === "always"} onClick={() => setNewTx({ ...newTx, fixedMode: "always" })}>Sempre</Pill>
              </div>
            </Field>
            {newTx.fixedMode === "months" && (
              <Field label="Por quantos meses se repete?"><input style={inputStyle} type="number" min="1" value={newTx.repeatMonths} onChange={e => setNewTx({ ...newTx, repeatMonths: e.target.value })} /></Field>
            )}
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "var(--muted)" }}>
              Vamos lançar esse valor agora, em {newTx.date?.split("-").reverse().join("/")}. {newTx.fixedMode === "always"
                ? "Todo mês seguinte, mostramos um lembrete pra você confirmar se quer lançar de novo — sem gerar sozinho."
                : `Todo mês, pelos próximos ${newTx.repeatMonths || 0} meses, mostramos um lembrete pra você confirmar.`}
            </div>
          </div>
        )}

        <Field label="Tag (opcional)">
          <select style={inputStyle} value={newTx.tag} onChange={e => setNewTx({ ...newTx, tag: e.target.value })}>
            <option value="">Sem tag</option>
            {(data.tags || []).map(t => <option key={t} value={t}>#{t}</option>)}
          </select>
        </Field>

        <button onClick={saveNewTx} style={primaryBtn}>{editingId ? "Salvar alterações" : "Salvar lançamento"}</button>
      </Sheet>

      {/* bottom bar de seleção */}
      {mode === "select" && selected.length > 0 && (
        <div style={{ position:"absolute", left:0, right:0, bottom: 0, background:"#16283D", borderRadius:"18px 18px 0 0", padding:"14px 18px", display:"flex", alignItems:"center", gap:10, boxShadow:"0 -8px 24px rgba(0,0,0,0.18)" }}>
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:"Inter", fontSize:11, color:"#AAB8C4" }}>Total selecionado</div>
            <div style={{ fontFamily:"IBM Plex Mono", fontSize:16, fontWeight:700, color:"#fff" }}>{brl(selTotal)}</div>
          </div>
          <button onClick={deleteSelected} style={{ width:38, height:38, borderRadius:10, border:"none", background:"#A13D46", display:"flex",alignItems:"center",justifyContent:"center", cursor:"pointer" }}><Icon name="trash" size={17} color="#fff" /></button>
          {selected.length === 1 && (
            <button onClick={() => { const tx = data.transactions.find(t=>t.id===selected[0]); setMode("normal"); setSelected([]); if (tx) openEdit(tx); }} style={{ padding:"9px 16px", borderRadius:10, border:"1.5px solid #fff", background:"transparent", color:"#fff", fontFamily:"Inter", fontWeight:700, fontSize:13, cursor:"pointer" }}>Alterar</button>
          )}
        </div>
      )}

      {/* importar CSV */}
      <Sheet open={importOpen} onClose={() => { setImportOpen(false); setImportRows([]); }} title="Importar CSV" large>
        {importRows.length === 0 ? (
          <div>
            <div style={{ fontFamily:"Inter", fontSize:13, color:"var(--muted)", marginBottom:14 }}>Selecione o arquivo CSV exportado do app do banco (ex: fatura Nubank).</div>
            <input type="file" accept=".csv" onChange={handleCsvFile} style={inputStyle} />
          </div>
        ) : (
          <div>
            <Field label="Cartão de destino">
              <select style={inputStyle} value={importCardId} onChange={e=>setImportCardId(e.target.value)}>
                <option value="">Selecione</option>
                {myCards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
            <div style={{ fontFamily:"Inter", fontSize:12, color:"var(--muted)", margin:"6px 0 12px" }}>{importRows.length} lançamento(s) encontrado(s). Desmarque o que não quiser importar.</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:14 }}>
              {importRows.map((r,i) => (
                <Card key={i} onClick={() => !r.already && toggleImportRow(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:10, opacity: r.already ? 0.5 : 1, cursor: r.already ? "default" : "pointer" }}>
                  <div style={{ width:20, height:20, borderRadius:6, border:"1.5px solid var(--accent)", background: r.checked ? "var(--accent)" : "transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                    {r.checked && <Icon name="check" size={13} color="#fff" />}
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:"Inter", fontSize:13, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.desc}{r.total ? ` (${r.current}/${r.total})` : ""}</div>
                    <div style={{ fontFamily:"Inter", fontSize:11, color:"var(--muted-2)" }}>{r.date.split("-").reverse().join("/")}{r.already ? " · já importado" : ""}</div>
                  </div>
                  <div style={{ fontFamily:"IBM Plex Mono", fontSize:13, fontWeight:600, color:"#A13D46" }}>{brl(-r.amount)}</div>
                </Card>
              ))}
            </div>
            <button onClick={doImport} style={primaryBtn}>Importar selecionados</button>
          </div>
        )}
      </Sheet>

      {/* ações rápidas ao tocar num lançamento */}
      <Sheet open={!!actionFor} onClose={() => setActionFor(null)}>
        {actionFor && (
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16, paddingBottom:14, borderBottom:"1px solid var(--border)" }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background: actionFor.type==="despesa"?"#A13D46":actionFor.type==="receita"?"#1E7F63":"#A9834B" }} />
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:"Inter", fontSize:14, fontWeight:700 }}>{actionFor.desc}</div>
                <div style={{ fontFamily:"Inter", fontSize:11.5, color:"var(--muted-2)" }}>{actionFor.category}</div>
              </div>
              <div style={{ fontFamily:"IBM Plex Mono", fontSize:15, fontWeight:600, color: actionFor.value>=0?"#1E7F63":"#A13D46" }}>{brl(actionFor.value)}</div>
            </div>
            <button onClick={() => openEdit(actionFor)} style={{ ...primaryBtn, marginBottom: 10, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}><Icon name="edit" size={16} color="#fff" /> Alterar lançamento</button>
            <button onClick={() => deleteOne(actionFor)} style={{ ...secondaryBtn, marginBottom: 10, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}><Icon name="trash" size={16} color="#A13D46" /> Excluir lançamento</button>
            <button onClick={() => setActionFor(null)} style={{ width:"100%", padding:"13px", borderRadius:13, border:"none", background:"transparent", color:"var(--muted)", fontFamily:"Inter", fontWeight:600, fontSize:14, cursor:"pointer" }}>Cancelar</button>
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ============================================================ SCREEN: RELATÓRIOS */
function Relatorios({ data, date, setDate }) {
  const [tab, setTab] = useState("categorias");
  const [statusFilter, setStatusFilter] = useState("todos");

  const monthTx = useMemo(() => data.transactions.filter(t => {
    const d = parseLocalDate(t.date);
    return d.getFullYear() === date.getFullYear() && d.getMonth() === date.getMonth() &&
      (statusFilter === "todos" || t.status === statusFilter);
  }), [data.transactions, date, statusFilter]);

  const despesasPorCat = useMemo(() => {
    const m = {};
    monthTx.filter(t=>t.type==="despesa").forEach(t => { m[t.category] = (m[t.category]||0) + Math.abs(t.value); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [monthTx]);
  const totalDespesas = despesasPorCat.reduce((s,[,v])=>s+v,0);

  const palette = ["#16283D","#1E7F63","#A13D46","#A9834B","#3E5C76","#5B6B7C","#6B7B8C","#8C6D46"];
  let acc = 0;
  const gap = despesasPorCat.length > 1 ? 1.6 : 0;
  const slices = despesasPorCat.map(([cat,val],i) => {
    const frac = totalDespesas ? val/totalDespesas : 0;
    const start = acc; acc += frac;
    return { cat, val, frac, start, color: palette[i % palette.length] };
  });

  const receitas = monthTx.filter(t=>t.type==="receita").reduce((s,t)=>s+t.value,0);
  const despesas = monthTx.filter(t=>t.type==="despesa").reduce((s,t)=>s+Math.abs(t.value),0);
  const saldo = receitas - despesas;

  const tags = useMemo(() => {
    const m = {};
    monthTx.forEach(t => { const tg = t.tag || "sem tag"; m[tg] = (m[tg]||0) + t.value; });
    return Object.entries(m);
  }, [monthTx]);

  return (
    <div style={{ paddingBottom: 100 }}>
      <MonthBar date={date} setDate={setDate} title="Relatórios" />

      <div style={{ padding: "4px 18px 0", display: "flex", gap: 8 }}>
        {[["categorias","Categorias"],["balanco","Balanço"],["tags","Tags"]].map(([v,l]) => (
          <Pill key={v} active={tab===v} onClick={()=>setTab(v)}>{l}</Pill>
        ))}
      </div>
      <div style={{ padding: "10px 18px 0", display: "flex", gap: 8 }}>
        {[["todos","Todos"],["resolvido","Pagos"],["pendente","Não pagos"]].map(([v,l]) => (
          <Pill key={v} active={statusFilter===v} onClick={()=>setStatusFilter(v)}>{l}</Pill>
        ))}
      </div>

      {tab === "categorias" && (
        <div style={{ padding: "18px 18px 0" }}>
          <Card>
            {totalDespesas === 0 ? (
              <div style={{ fontFamily:"Inter", fontSize:13.5, color:"var(--muted)", textAlign:"center", padding:"20px 0" }}>Sem despesas neste período.</div>
            ) : (
              <div style={{ display:"flex", alignItems:"center", gap: 22, flexWrap: "wrap", justifyContent:"center" }}>
                <svg width="168" height="168" viewBox="0 0 32 32" style={{ transform: "rotate(-90deg)" }}>
                  <circle r="16" cx="16" cy="16" fill="transparent" stroke="var(--soft)" strokeWidth="6" />
                  {slices.map(s => {
                    const len = Math.max(0, s.frac*100 - gap);
                    const dash = `${len} ${100-len}`;
                    const offset = 100 - s.start*100;
                    return <circle key={s.cat} r="16" cx="16" cy="16" fill="transparent" stroke={s.color} strokeWidth="6" strokeLinecap="round" strokeDasharray={dash} strokeDashoffset={offset} pathLength="100" />;
                  })}
                </svg>
                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                  {slices.map(s => (
                    <div key={s.cat} style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <div style={{ width:10, height:10, borderRadius:3, background:s.color }} />
                      <div style={{ fontFamily:"Inter", fontSize:12.5, color:"var(--ink-soft)" }}>{s.cat}</div>
                      <div style={{ fontFamily:"IBM Plex Mono", fontSize:12, color:"var(--muted-2)" }}>{Math.round(s.frac*100)}%</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </Card>
        </div>
      )}

      {tab === "balanco" && (
        <div style={{ padding: "18px 18px 0" }}>
          <Card style={{ padding: "24px 12px 20px" }}>
            <div style={{ display:"flex", alignItems:"flex-end", gap: 12, height: 180, justifyContent:"center" }}>
              {[["Receitas",receitas,"#1E7F63"],["Despesas",despesas,"#A13D46"],["Saldo",Math.abs(saldo), saldo>=0?"#16283D":"#A13D46"]].map(([lab,val,color]) => {
                const max = Math.max(receitas,despesas,Math.abs(saldo),1);
                const h = Math.max(6,(val/max)*120);
                return (
                  <div key={lab} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8, width: 92, minWidth: 92 }}>
                    <div style={{ fontFamily:"IBM Plex Mono", fontSize:12, fontWeight:600, color:"var(--ink-soft)", textAlign:"center", lineHeight:1.3 }}>{brl(val)}</div>
                    <div style={{ width: 44, height: h, background: color, borderRadius: 8 }} />
                    <div style={{ fontFamily:"Inter", fontSize:12.5, fontWeight:600, color:"var(--muted)" }}>{lab}</div>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      )}

      {tab === "tags" && (
        <div style={{ padding: "18px 18px 0", display:"flex", flexDirection:"column", gap:8 }}>
          {tags.length === 0 && <Card><div style={{ fontFamily:"Inter", fontSize:13.5, color:"var(--muted)" }}>Nenhuma tag neste período.</div></Card>}
          {tags.map(([tag,val]) => (
            <Card key={tag} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding: 14 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <Icon name="tag" size={16} color="var(--label)" />
                <div style={{ fontFamily:"Inter", fontSize:13.5, fontWeight:600 }}>{tag}</div>
              </div>
              <div style={{ fontFamily:"IBM Plex Mono", fontSize:14, fontWeight:600, color: val>=0?"#1E7F63":"#A13D46" }}>{brl(val)}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================ SCREEN: LIMITES */
function Limites({ data, patch }) {
  const [adding, setAdding] = useState(false);
  const [detailId, setDetailId] = useState(null);
  const [draft, setDraft] = useState({ category: DESPESA_CATS[0], value: "", repeats: true, period: "Mensal" });

  const spentFor = (cat) => data.transactions.filter(t => t.type==="despesa" && t.category===cat)
    .reduce((s,t)=>s+Math.abs(t.value),0);

  const totalLimite = data.limits.reduce((s,l)=>s+l.value,0);
  const totalGasto = data.limits.reduce((s,l)=>s+spentFor(l.category),0);
  const totalDisponivel = totalLimite - totalGasto;

  function addLimit() {
    if (!draft.value) return;
    patch(d => ({ ...d, limits: [...d.limits, { id: uid(), category: draft.category, value: parseFloat(draft.value), repeats: draft.repeats, period: draft.period }] }));
    setAdding(false);
    setDraft({ category: DESPESA_CATS[0], value: "", repeats: true, period: "Mensal" });
  }

  const detail = data.limits.find(l=>l.id===detailId);

  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"22px 18px 4px" }}>
        <div style={{ fontFamily: "Source Serif 4, serif", fontSize: 21, fontWeight: 600, color: "var(--accent)" }}>Limites de gastos</div>
        <button onClick={()=>setAdding(true)} style={{ ...navBtn, background:"#16283D" }}><Icon name="plus" color="#fff" size={18} /></button>
      </div>

      <div style={{ padding: "14px 18px 0", display:"flex", flexDirection:"column", gap:8 }}>
        {data.limits.map(l => {
          const spent = spentFor(l.category);
          const pct = Math.min(100, (spent/l.value)*100);
          const over = spent > l.value;
          return (
            <Card key={l.id} onClick={()=>setDetailId(l.id)} style={{ cursor:"pointer" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom: 8 }}>
                <div style={{ fontFamily:"Inter", fontSize:13.5, fontWeight:700 }}>{l.category}</div>
                <div style={{ fontFamily:"IBM Plex Mono", fontSize:12.5, color: over ? "#A13D46" : "var(--muted)" }}>{brl(spent)} / {brl(l.value)}</div>
              </div>
              <div style={{ height:8, borderRadius:6, background:"var(--border-2)", overflow:"hidden" }}>
                <div style={{ width: `${pct}%`, height:"100%", background: over ? "#A13D46" : "var(--label)", borderRadius:6, transition:"width .3s" }} />
              </div>
              <div style={{ fontFamily:"Inter", fontSize:11, color:"var(--muted-2)", marginTop:6 }}>{l.repeats ? "Repete todo mês" : l.period}</div>
            </Card>
          );
        })}
      </div>

      {/* total disponível — clicável */}
      <div style={{ padding: "16px 18px 0" }}>
        <Card onClick={()=>setDetailId("__total")} style={{ background:"#16283D", color:"#FFFFFF", cursor:"pointer" }}>
          <div style={{ fontFamily:"Inter", fontSize:12, color:"#AAB8C4", fontWeight:600 }}>Total disponível</div>
          <div style={{ fontFamily:"Source Serif 4, serif", fontSize:26, fontWeight:600, marginBottom:8 }}>{brl(totalDisponivel)}</div>
          <div style={{ height:8, borderRadius:6, background:"rgba(255,255,255,0.2)", overflow:"hidden" }}>
            <div style={{ width: `${Math.min(100,(totalGasto/(totalLimite||1))*100)}%`, height:"100%", background:"var(--soft)", borderRadius:6 }} />
          </div>
        </Card>
      </div>

      <Sheet open={adding} onClose={()=>setAdding(false)} title="Novo limite de gasto">
        <Field label="Categoria">
          <select style={inputStyle} value={draft.category} onChange={e=>setDraft({...draft, category:e.target.value})}>
            {DESPESA_CATS.map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Valor do limite">
          <input style={inputStyle} type="number" placeholder="Ex: 100" value={draft.value} onChange={e=>setDraft({...draft, value:e.target.value})} />
        </Field>
        <Field label="Este limite se repete?">
          <div style={{ display:"flex", gap:8 }}>
            <Pill active={draft.repeats} onClick={()=>setDraft({...draft, repeats:true, period:"Mensal"})}>Sim, todo mês</Pill>
            <Pill active={!draft.repeats} onClick={()=>setDraft({...draft, repeats:false, period:"Este mês"})}>Não, só este período</Pill>
          </div>
        </Field>
        <button onClick={addLimit} style={primaryBtn}>Salvar limite</button>
      </Sheet>

      <Sheet open={!!detailId} onClose={()=>setDetailId(null)} title={detailId==="__total" ? "Resumo geral" : detail?.category}>
        {detailId === "__total" ? (
          <div>
            <Field label="Limite total do mês"><div style={{ fontFamily:"IBM Plex Mono", fontSize:20, fontWeight:600 }}>{brl(totalLimite)}</div></Field>
            <Field label="Gasto acumulado"><div style={{ fontFamily:"IBM Plex Mono", fontSize:20, fontWeight:600, color:"#A13D46" }}>{brl(totalGasto)}</div></Field>
            <Field label="Total disponível"><div style={{ fontFamily:"IBM Plex Mono", fontSize:20, fontWeight:600, color:"#1E7F63" }}>{brl(totalDisponivel)}</div></Field>
            <div style={{ height:10, borderRadius:6, background:"var(--border-2)", overflow:"hidden" }}>
              <div style={{ width: `${Math.min(100,(totalGasto/(totalLimite||1))*100)}%`, height:"100%", background:"#16283D" }} />
            </div>
          </div>
        ) : detail && (
          <div>
            <Field label="Gasto acumulado"><div style={{ fontFamily:"IBM Plex Mono", fontSize:18, fontWeight:600 }}>{brl(spentFor(detail.category))}</div></Field>
            <Field label="Limite"><div style={{ fontFamily:"IBM Plex Mono", fontSize:18, fontWeight:600 }}>{brl(detail.value)}</div></Field>
            <button onClick={()=>{ patch(d=>({...d, limits: d.limits.filter(l=>l.id!==detail.id)})); setDetailId(null); }} style={secondaryBtn}>Remover limite</button>
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ============================================================ SCREEN: CONTA */
function NewBankSheet({ open, onClose, onCreated, patch }) {
  const [name, setName] = useState("");
  const [color, setColor] = useState(BANK_COLORS[0]);
  function save() {
    if (!name.trim()) return;
    const key = "custom_" + name.trim().toLowerCase().replace(/\s+/g, "_") + "_" + uid();
    patch(d => ({ ...d, customBanks: [...(d.customBanks || []), { key, name: name.trim(), color }] }));
    onCreated(key);
    setName(""); setColor(BANK_COLORS[0]);
    onClose();
  }
  return (
    <Sheet open={open} onClose={onClose} title="Novo banco">
      <Field label="Nome do banco"><input style={inputStyle} placeholder="Ex: Mercado Pago" value={name} onChange={e=>setName(e.target.value)} /></Field>
      <Field label="Cor">
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {BANK_COLORS.map(c => (
            <button key={c} onClick={()=>setColor(c)} style={{ width:32, height:32, borderRadius:"50%", background:c, border: color===c ? "3px solid var(--ink)" : "2px solid transparent", cursor:"pointer" }} />
          ))}
        </div>
      </Field>
      <button onClick={save} style={primaryBtn}>Salvar banco</button>
    </Sheet>
  );
}

function Conta({ data, patch, isDark, toggleTheme, initialScreen, myPersonId, myPerson, switchPerson }) {

  const [editDraft, setEditDraft] = useState(myPerson || { name: "", email: "", birthdate: "" });
  const [addingCard, setAddingCard] = useState(false);
  const [cardEditing, setCardEditing] = useState(false);
  const [cardEditDraft, setCardEditDraft] = useState(null);
  function saveCardEdit() {
    if (!cardEditDraft.name) return;
    patch(d => ({ ...d, cards: d.cards.map(c => c.id === cardEditDraft.id ? { ...c, name: cardEditDraft.name, bank: cardEditDraft.bank, limit: parseFloat(cardEditDraft.limit)||0, closingDay: parseInt(cardEditDraft.closingDay)||1, dueDay: parseInt(cardEditDraft.dueDay)||1 } : c) }));
    setCardEditing(false); setCardEditDraft(null);
  }
  function removeCard() {
    patch(d => ({ ...d, cards: d.cards.filter(c => c.id !== cardEditDraft.id) }));
    setCardEditing(false); setCardEditDraft(null);
  }
  const [cardDraft, setCardDraft] = useState({ name:"", bank:"nubank", limit:"" });
  const [newCat, setNewCat] = useState("");
  const [catType, setCatType] = useState("despesa");
  const [newTag, setNewTag] = useState("");
  const [accDraft, setAccDraft] = useState(null);
  const [newBankOpen, setNewBankOpen] = useState(false);
  const [accEditing, setAccEditing] = useState(false);

  function saveAccount() {
    if (!accDraft.name) return;
    const balance = parseFloat(accDraft.balance) || 0;
    if (accDraft.id) {
      patch(d => ({ ...d, accounts: d.accounts.map(a => a.id === accDraft.id ? { ...a, name: accDraft.name, bank: accDraft.bank, balance } : a) }));
    } else {
      patch(d => ({ ...d, accounts: [...d.accounts, { id: uid(), name: accDraft.name, bank: accDraft.bank, balance, ownerId: myPersonId }] }));
    }
    setAccEditing(false);
    setAccDraft(null);
  }
  function removeAccount() {
    patch(d => ({ ...d, accounts: d.accounts.filter(a => a.id !== accDraft.id) }));
    setAccEditing(false);
    setAccDraft(null);
  }

  function addTag() {
    const clean = newTag.trim().toLowerCase().replace(/\s+/g, "-");
    if (!clean) return;
    patch(d => {
      const current = d.tags || [];
      if (current.includes(clean)) return d;
      return { ...d, tags: [...current, clean] };
    });
    setNewTag("");
  }
  function removeTag(tag) {
    patch(d => ({
      ...d,
      tags: (d.tags || []).filter(t => t !== tag),
      transactions: d.transactions.map(t => t.tag === tag ? { ...t, tag: "" } : t),
